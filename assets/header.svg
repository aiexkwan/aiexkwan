<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Alex Kwan — full-stack engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161e"/><stop offset="1" stop-color="#1a1b26"/>
    </linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#7aa2f7" stop-opacity=".55"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#bb9af7" stop-opacity=".45"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></radialGradient>
    <radialGradient id="o3"><stop offset="0" stop-color="#7dcfff" stop-opacity=".35"/><stop offset="1" stop-color="#7dcfff" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#c0caf5"/><stop offset=".55" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#292e42" stroke-width="1"/></pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,30px)}}
      @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-20px)}}
      @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-40px)}}
      .o1{animation:drift1 14s ease-in-out infinite}
      .o2{animation:drift2 18s ease-in-out infinite}
      .o3{animation:drift3 16s ease-in-out infinite}
      @keyframes role{0%{opacity:0;transform:translateY(8px)}4%,29%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-8px)}}
      .r{animation:role 12s infinite}.r2,.r3{opacity:0}
      .r2{animation-delay:4s}.r3{animation-delay:8s}
      @keyframes blink{50%{opacity:0}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .p{animation:pulse 2.4s ease-in-out infinite}
      .p2{animation-delay:.8s}.p3{animation-delay:1.6s}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity=".55"/>
    <circle class="o1" cx="980" cy="60" r="260" fill="url(#o1)"/>
    <circle class="o2" cx="1120" cy="300" r="220" fill="url(#o2)"/>
    <circle class="o3" cx="160" cy="330" r="200" fill="url(#o3)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="20" fill="none" stroke="#292e42"/>

  <!-- prompt line -->
  <text x="64" y="84" class="mono" font-size="16" fill="#565f89">~/aiexkwan <tspan fill="#9ece6a">❯</tspan> <tspan fill="#a9b1d6">whoami</tspan></text>

  <text x="62" y="160" class="sans" font-size="68" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Alex Kwan</text>

  <g class="mono" font-size="22">
    <text x="64" y="212" fill="#7dcfff"><tspan fill="#565f89">// </tspan>Full-stack engineer · Manchester, UK</text>
  </g>
  <g class="mono" font-size="20" fill="#c0caf5">
    <text x="64" y="256" class="r r1"><tspan fill="#bb9af7">building</tspan> an ADE where AI agents ship real code</text>
    <text x="64" y="256" class="r r2"><tspan fill="#bb9af7">writing</tspan> Rust daemons, trading engines &amp; TypeScript apps</text>
    <text x="64" y="256" class="r r3"><tspan fill="#bb9af7">shipping</tspan> SaaS for UK SMEs, end to end</text>
  </g>
  <rect class="cur" x="64" y="270" width="12" height="3" fill="#7aa2f7"/>

  <!-- right: agent panes motif -->
  <g transform="translate(820 70)">
    <g>
      <rect width="300" height="52" rx="10" fill="#1f2335" stroke="#3b4261"/>
      <circle class="p" cx="24" cy="26" r="6" fill="#9ece6a"/>
      <text x="44" y="31" class="mono" font-size="14" fill="#c0caf5">agent·1 <tspan fill="#565f89">─</tspan> <tspan fill="#9ece6a">working</tspan></text>
    </g>
    <g transform="translate(0 66)">
      <rect width="300" height="52" rx="10" fill="#1f2335" stroke="#3b4261"/>
      <circle class="p p2" cx="24" cy="26" r="6" fill="#e0af68"/>
      <text x="44" y="31" class="mono" font-size="14" fill="#c0caf5">agent·2 <tspan fill="#565f89">─</tspan> <tspan fill="#e0af68">needs you</tspan></text>
    </g>
    <g transform="translate(0 132)">
      <rect width="300" height="52" rx="10" fill="#1f2335" stroke="#3b4261"/>
      <circle class="p p3" cx="24" cy="26" r="6" fill="#7aa2f7"/>
      <text x="44" y="31" class="mono" font-size="14" fill="#c0caf5">agent·3 <tspan fill="#565f89">─</tspan> <tspan fill="#7aa2f7">review ✓</tspan></text>
    </g>
  </g>
</svg>
