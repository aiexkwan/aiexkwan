<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="AURIX — desktop Agent Development Environment for AI coding agents"><defs><style>.m{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style></defs><rect x=".5" y=".5" width="1199" height="279" rx="16" fill="#1a1b26" stroke="#c0caf5" stroke-opacity=".08"/><text x="32" y="52" class="m" font-size="13" fill="#565f89">Agent Development Environment · macOS and Windows</text><text x="31" y="92" class="s" font-size="28" font-weight="500" fill="#c0caf5">AURIX</text><text x="32" y="132" class="s" font-size="15" fill="#9aa5ce">A desktop home for AI coding agents. Run Claude Code, Codex and</text><text x="32" y="156" class="s" font-size="15" fill="#9aa5ce">more side by side, answer approvals in one place, and review each</text><text x="32" y="180" class="s" font-size="15" fill="#9aa5ce">task before it merges. MCP plugins, a built-in browser, shared</text><text x="32" y="204" class="s" font-size="15" fill="#9aa5ce">memory and remote access.</text><text x="32" y="248" class="m" font-size="13" fill="#565f89">Rust · TypeScript · Electron · xterm.js · MCP</text><g transform="translate(700 32)"><rect x=".5" y=".5" width="147" height="175" rx="8" fill="#1f2335" stroke="#c0caf5" stroke-opacity=".08"/><text x="12" y="24" class="m" font-size="12" fill="#565f89">claude</text><rect x="0" y="36" width="148" height="1" fill="#c0caf5" fill-opacity=".08"/><text x="12" y="60" class="m" font-size="12" fill="#9aa5ce">› edit session.rs</text><text x="12" y="80" class="m" font-size="12" fill="#9aa5ce">› cargo test</text><text x="12" y="100" class="m" font-size="12" fill="#565f89">  running…</text><rect x="0" y="132" width="148" height="1" fill="#c0caf5" fill-opacity=".08"/><circle cx="16" cy="154" r="4" fill="#9ece6a"/><text x="28" y="158" class="m" font-size="12" fill="#9ece6a">working</text></g><g transform="translate(860 32)"><rect x=".5" y=".5" width="147" height="175" rx="8" fill="#1f2335" stroke="#c0caf5" stroke-opacity=".08"/><text x="12" y="24" class="m" font-size="12" fill="#565f89">codex</text><rect x="0" y="36" width="148" height="1" fill="#c0caf5" fill-opacity=".08"/><text x="12" y="60" class="m" font-size="12" fill="#c0caf5">Allow git push?</text><rect x="12.5" y="76.5" width="66" height="23" rx="4" fill="#1a1b26" stroke="#c0caf5" stroke-opacity=".08"/><text x="45.5" y="92" text-anchor="middle" class="m" font-size="12" fill="#c0caf5">Approve</text><rect x="86.5" y="76.5" width="44" height="23" rx="4" fill="#1a1b26" stroke="#c0caf5" stroke-opacity=".08"/><text x="108.5" y="92" text-anchor="middle" class="m" font-size="12" fill="#9aa5ce">Deny</text><rect x="0" y="132" width="148" height="1" fill="#c0caf5" fill-opacity=".08"/><circle cx="16" cy="154" r="4" fill="#e0af68"/><text x="28" y="158" class="m" font-size="12" fill="#e0af68">needs you</text></g><g transform="translate(1020 32)"><rect x=".5" y=".5" width="147" height="175" rx="8" fill="#1f2335" stroke="#c0caf5" stroke-opacity=".08"/><text x="12" y="24" class="m" font-size="12" fill="#565f89">pi</text><rect x="0" y="36" width="148" height="1" fill="#c0caf5" fill-opacity=".08"/><text x="12" y="60" class="m" font-size="12" fill="#9aa5ce">checks 6/6 pass</text><text x="12" y="80" class="m" font-size="12" fill="#565f89">ready to merge</text><rect x="0" y="132" width="148" height="1" fill="#c0caf5" fill-opacity=".08"/><circle cx="16" cy="154" r="4" fill="#7aa2f7"/><text x="28" y="158" class="m" font-size="12" fill="#7aa2f7">review</text></g><circle cx="704" cy="244" r="4" fill="#9ece6a"/><text x="716" y="248" class="m" font-size="12" fill="#565f89">releases public</text><circle cx="852" cy="244" r="4" fill="#565f89"/><text x="864" y="248" class="m" font-size="12" fill="#565f89">source private</text></svg>