<text x="31" y="90" class="sans" font-size="34" font-weight="800" fill="url(#a)" letter-spacing="-.5">AURIX</text>
<rect x="1035" y="26" width="137" height="24" rx="6" fill="#1f2335" stroke="#3b4261"/><circle cx="1047" cy="38" r="3.5" fill="#9ece6a"/><text x="1056" y="42.5" class="mono" font-size="11.5" fill="#a9b1d6">releases public</text><rect x="898" y="26" width="129" height="24" rx="6" fill="#1f2335" stroke="#3b4261"/><circle cx="910" cy="38" r="3.5" fill="#565f89"/><text x="919" y="42.5" class="mono" font-size="11.5" fill="#a9b1d6">source private</text><text x="32" y="132" class="sans" font-size="15" fill="#a9b1d6">A desktop home for AI coding agents. Run Claude Code, Codex and more side by side,</text><text x="32" y="156" class="sans" font-size="15" fill="#a9b1d6">answer every approval from one inbox, and review each task before it merges.</text><text x="32" y="180" class="sans" font-size="15" fill="#a9b1d6">MCP plugins, a built-in browser, shared memory and remote access — on macOS &amp; Windows.</text><rect x="32" y="210" width="54" height="26" rx="13" fill="#7aa2f7" fill-opacity=".12" stroke="#7aa2f7" stroke-opacity=".45"/><text x="59.0" y="227.5" text-anchor="middle" class="mono" font-size="12.5" fill="#7aa2f7">Rust</text><rect x="94" y="210" width="100" height="26" rx="13" fill="#7aa2f7" fill-opacity=".12" stroke="#7aa2f7" stroke-opacity=".45"/><text x="144.0" y="227.5" text-anchor="middle" class="mono" font-size="12.5" fill="#7aa2f7">TypeScript</text><rect x="202" y="210" width="84" height="26" rx="13" fill="#7aa2f7" fill-opacity=".12" stroke="#7aa2f7" stroke-opacity=".45"/><text x="244.0" y="227.5" text-anchor="middle" class="mono" font-size="12.5" fill="#7aa2f7">Electron</text><rect x="294" y="210" width="84" height="26" rx="13" fill="#7aa2f7" fill-opacity=".12" stroke="#7aa2f7" stroke-opacity=".45"/><text x="336.0" y="227.5" text-anchor="middle" class="mono" font-size="12.5" fill="#7aa2f7">xterm.js</text><rect x="386" y="210" width="46" height="26" rx="13" fill="#7aa2f7" fill-opacity=".12" stroke="#7aa2f7" stroke-opacity=".45"/><text x="409.0" y="227.5" text-anchor="middle" class="mono" font-size="12.5" fill="#7aa2f7">MCP</text><g transform="translate(762 92)"><rect width="130" height="104" rx="10" fill="#16161e" stroke="#3b4261"/><circle cx="14" cy="15" r="3.5" fill="#f7768e"/><circle cx="25" cy="15" r="3.5" fill="#e0af68"/><circle cx="36" cy="15" r="3.5" fill="#9ece6a"/><text x="118" y="19" text-anchor="end" class="mono" font-size="11" fill="#565f89">claude</text><rect x="14" y="34" width="80" height="5" rx="2.5" fill="#3b4261"/><rect x="14" y="46" width="98" height="5" rx="2.5" fill="#3b4261"/><rect x="14" y="58" width="56" height="5" rx="2.5" fill="#3b4261"/><circle class="p" style="animation-delay:0.0s" cx="19" cy="85" r="4" fill="#9ece6a"/><text x="30" y="89" class="mono" font-size="12" fill="#9ece6a">working</text></g><g transform="translate(902 92)"><rect width="130" height="104" rx="10" fill="#16161e" stroke="#3b4261"/><circle cx="14" cy="15" r="3.5" fill="#f7768e"/><circle cx="25" cy="15" r="3.5" fill="#e0af68"/><circle cx="36" cy="15" r="3.5" fill="#9ece6a"/><text x="118" y="19" text-anchor="end" class="mono" font-size="11" fill="#565f89">codex</text><rect x="14" y="34" width="70" height="5" rx="2.5" fill="#3b4261"/><rect x="14" y="46" width="84" height="5" rx="2.5" fill="#3b4261"/><rect x="14" y="58" width="68" height="5" rx="2.5" fill="#3b4261"/><circle class="p" style="animation-delay:0.8s" cx="19" cy="85" r="4" fill="#e0af68"/><text x="30" y="89" class="mono" font-size="12" fill="#e0af68">needs you</text></g><g transform="translate(1042 92)"><rect width="130" height="104" rx="10" fill="#16161e" stroke="#3b4261"/><circle cx="14" cy="15" r="3.5" fill="#f7768e"/><circle cx="25" cy="15" r="3.5" fill="#e0af68"/><circle cx="36" cy="15" r="3.5" fill="#9ece6a"/><text x="118" y="19" text-anchor="end" class="mono" font-size="11" fill="#565f89">pi</text><rect x="14" y="34" width="60" height="5" rx="2.5" fill="#3b4261"/><rect x="14" y="46" width="70" height="5" rx="2.5" fill="#3b4261"/><rect x="14" y="58" width="80" heig