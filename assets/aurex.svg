<svg xmlns="http://www.w3.org/2000/svg" width="590" height="250" viewBox="0 0 590 250" role="img" aria-label="AUREX — Automated trading · Hyperliquid">
<defs><style>
.mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.6}}
.g{animation:glow 5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.p{animation:pulse 2.4s ease-in-out infinite}
</style>
<linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#ff9e64"/><stop offset="1" stop-color="#f7768e"/></linearGradient>
<radialGradient id="r"><stop offset="0" stop-color="#ff9e64" stop-opacity=".35"/><stop offset="1" stop-color="#ff9e64" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="590" height="250" rx="16"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="590" height="250" fill="#1a1b26"/>
<circle class="g" cx="550" cy="270" r="225" fill="url(#r)"/>
<rect width="590" height="4" fill="url(#a)"/></g>
<rect x=".5" y=".5" width="589" height="249" rx="16" fill="none" stroke="#292e42"/>
<text x="32" y="44" class="mono" font-size="12.5" letter-spacing="2" fill="#ff9e64">AUTOMATED TRADING · HYPERLIQUID</text>
<text x="31" y="90" class="sans" font-size="34" font-weight="800" fill="url(#a)" letter-spacing="-.5">AUREX</text>
<rect x="485" y="26" width="77" height="24" rx="6" fill="#1f2335" stroke="#3b4261"/><circle cx="497" cy="38" r="3.5" fill="#565f89"/><text x="506" y="42.5" class="mono" font-size="11.5" fill="#a9b1d6">private</text><text x="32" y="132" class="sans" font-size="15" fill="#a9b1d6">Perpetuals trading system with strategy, risk control,</text><text x="32" y="156" class="sans" font-size="15" fill="#a9b1d6">execution and backtesting in one Rust core,</text><text x="32" y="180" class="sans" font-size="15" fill="#a9b1d6">plus a desktop console to watch it run.</text><rect x="32" y="200" width="54" height="26" rx="13" fill="#ff9e64" fill-opacity=".12" stroke="#ff9e64" stroke-opacity=".45"/><text x="59.0" y="217.5" text-anchor="middle" class="mono" font-size="12.5" fill="#ff9e64">Rust</text><rect x="94" y="200" width="54" height="26" rx="13" fill="#ff9e64" fill-opacity=".12" stroke="#ff9e64" stroke-opacity=".45"/><text x="121.0" y="217.5" text-anchor="middle" class="mono" font-size="12.5" fill="#ff9e64">SQLx</text><rect x="156" y="200" width="84" height="26" rx="13" fill="#ff9e64" fill-opacity=".12" stroke="#ff9e64" stroke-opacity=".45"/><text x="198.0" y="217.5" text-anchor="middle" class="mono" font-size="12.5" fill="#ff9e64">Electron</text>
</svg>